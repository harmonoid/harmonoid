name: harmonoid
description: Plays & manages your music library. Looks beautiful & juicy.
publish_to: "none"
version: 0.3.34+9045

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  adaptive_layouts:
    path: external/adaptive_layouts
  animations: ^2.0.0
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  auto_size_text: ^3.0.0
  collection: ^1.18.0
  crypto: ^3.0.3
  draggable_float_widget: ^0.1.0
  drift: ^2.30.1
  dynamic_color: ^1.8.1
  ffi: ^2.1.2
  # https://github.com/miguelpruivo/flutter_file_picker/pull/1964
  file_picker: ^12.0.0-beta.7
  fluentui_system_icons: ^1.1.136
  flutter_discord_rpc: 1.0.0
  flutter_displaymode: ^0.7.0
  flutter_local_notifications:
    git:
      url: https://github.com/alexmercerind/flutter_local_notifications.git
      ref: 54c397a
      path: flutter_local_notifications
  flutter_markdown_plus: ^1.0.5
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  go_router: ^16.3.0
  http: ^1.2.1
  identity:
    path: external/identity
  image: ^4.5.4
  in_app_review: ^2.0.12
  json_annotation: ^4.9.0
  lastfm:
    path: external/lastfm
  lrc:
    git: https://github.com/alexmercerind/dart_lrc.git
  m3_expressive_shapes:
    git:
      url: https://github.com/kekland/m3_expressive_shapes.git
      ref: e023ce817dc087247b59e10660b2eaf3e00ffc38
  measure_size: ^4.0.0
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: media_kit
  media_kit_libs_android_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/android/media_kit_libs_android_audio
  media_kit_libs_ios_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/ios/media_kit_libs_ios_audio
  media_kit_libs_linux:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/linux/media_kit_libs_linux
  media_kit_libs_macos_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/macos/media_kit_libs_macos_audio
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/windows/media_kit_libs_windows_audio
  media_library:
    path: external/media_library
  mesh_gradient: ^1.3.7
  mpris_service:
    git:
      url: https://github.com/alexmercerind/mpris_service.git
      ref: master
  path: ^1.9.0
  path_provider: ^2.1.2
  permission_handler: ^12.0.3
  pool: ^1.5.2
  provider: ^6.0.1
  safe_local_storage: ^2.0.6
  share_plus: ^13.2.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.40
  syncfusion_flutter_sliders: 24.2.7
  synchronized: ^3.0.0+2
  system_fonts: ^1.0.1
  system_media_transport_controls:
    path: external/smtc-win32/bindings/system_media_transport_controls
  tag_reader:
    path: external/tag_reader
  taglib:
    path: external/taglib/taglib
  taglib_libs:
    path: external/taglib/taglib_libs
  uri_parser: ^3.0.2
  url_launcher: ^6.3.2
  uuid: ^4.3.3
  wakelock_plus: ^1.6.1
  win32: ^6.3.0
  windows_taskbar:
    git:
      url: https://github.com/alexmercerind/windows_taskbar.git
      ref: c1fe0c37171521af8b55bc8ce89734cfe13262c1

dev_dependencies:
  build_runner: ^2.4.8
  drift_dev: ^2.30.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.9.0

dependency_overrides:
  # https://github.com/MaikuB/flutter_local_notifications/issues/2777
  flutter_local_notifications_windows:
    git:
      url: https://github.com/alexmercerind/flutter_local_notifications.git
      ref: 54c397a
      path: flutter_local_notifications_windows
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: media_kit
  # https://github.com/Baseflow/flutter-permission-handler/issues/983
  # https://github.com/Baseflow/flutter-permission-handler/issues/1034
  permission_handler_windows:
    git:
      url: https://github.com/localsend/permission_handler_windows_noop.git
      ref: 2dadd8afbf81e0e3e4791d7144e689555e58f649
  # https://github.com/harmonoid/harmonoid/issues/587#issue-3850475343
  # https://github.com/alexmercerind/safe_local_storage/commit/984eac5927ffddbfe621991ad1b5a8af9673ef97
  safe_local_storage: ^2.0.6
  taglib:
    path: external/taglib/taglib
  vector_math: 2.2.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/localizations/
    - assets/localizations/localizations/
    - assets/vectors/
    - assets/visuals/
